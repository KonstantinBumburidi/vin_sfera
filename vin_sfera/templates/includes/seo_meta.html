{# Мета-теги страницы Wagtail. Данные — из SeoPageMixin (base/seo.py) #}
{% with title=page.get_meta_title description=page.get_meta_description image=page.get_meta_image site_root=page.get_site.root_url %}
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
{% if page.robots_noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<link rel="canonical" href="{{ page.full_url }}">

<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Сфера Сознания">
<meta property="og:url" content="{{ page.full_url }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
{% if image %}
<meta property="og:image" content="{{ site_root }}{{ image.url }}">
<meta property="og:image:width" content="{{ image.width }}">
<meta property="og:image:height" content="{{ image.height }}">
{% endif %}
<meta name="twitter:card" content="{% if image %}summary_large_image{% else %}summary{% endif %}">
{% endwith %}
