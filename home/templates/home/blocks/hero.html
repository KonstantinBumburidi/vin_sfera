{% load wagtailimages_tags %}

<div class="relative overflow-hidden">
    {% image value.image fill-1920x1080 as hero_img %}
    <!-- Затемнение -->
    <div class="absolute inset-0 bg-black/50"></div>
    <!-- Фоновое изображение -->
    <img src="{{ hero_img.url }}"
         alt="{{ value.title }}"
         class="w-full h-[80vh] md:h-[700px] object-cover object-center">
    <!-- Заголовок по центру -->
    <div class="absolute inset-0 flex flex-col items-center justify-center px-6">
        <h1 class="text-white text-4xl md:text-6xl lg:text-7xl font-bold text-center drop-shadow-2xl">
            {{ value.title }}
        </h1>
        {% if value.subtitle %}
            <p class="mt-4 md:mt-6 max-w-3xl text-white/90 text-base md:text-lg lg:text-xl text-center tracking-wide drop-shadow-lg">
                {{ value.subtitle }}
            </p>
        {% endif %}
    </div>
</div>
