instruction: >-
  Вспомните тревожащую вас ситуацию и оцените её неприятность по 10-балльной шкале
  (0 — безразличное отношение, 10 — максимальный уровень).

# Каждый элемент paragraphs — отдельный абзац.
techniques:
  - title: Коррекция энергетических каналов
    paragraphs:
      - >-
        «Я люблю и принимаю себя со всем своим (страхом) на самом глубоком уровне,
        с самого первого раза, когда я испытала (страх), и теперь я выбираю отпустить
        это чувство. Я выбираю мир, счастье, любовь, радость, гармонию, защищённость,
        прощение» (точки с 1 по 2).
      - >-
        Закрепляем: «Даже если я когда-либо испытала (страх), теперь я чувствую себя
        спокойно» (точки 6 + 14), вдох/выдох.

  - title: Неврологический баланс (создание условного рефлекса)
    paragraphs:
      - >-
        Вспомнить тревожную ситуацию и представить, что в этой ситуации вы спокойны,
        уверены, бесстрашны (подумать, как вы хотели бы чувствовать себя там).
      - Левой рукой стимулировать точку 6, правой — точку 14.
      - >-
        «Я принимаю и позволяю гармонии войти в мою жизнь, я отпускаю прошлое сейчас и навсегда».
      - >-
        Дополнительно: закрыть и открыть глаза, движения глазами, музыка, цвета, вкусы,
        запахи, арифметические действия, нестандартное дыхание.

  - title: Снятие блокировки/реверсии
    paragraphs:
      - 'Постукивать по точке 13 с двух сторон, проговаривая:'
      - >-
        «Я люблю и принимаю себя, даже если не хочу быть здоровой, успешной…», вдох/выдох.
      - >-
        «Я люблю и принимаю себя, даже когда хочу быть на 100 %, сейчас и навсегда,
        без всяких условий, даже если есть внутреннее сопротивление».
      - По 2 минуты 3 раза в день в течение 2 недель.
