# Термины для страницы «База знаний» (/baza-znaniy/).
# Загрузка: python3 manage.py import_glossary --dry-run, потом без --dry-run.
# Команда ДОБАВЛЯЕТ термины, которых ещё нет на странице (сравнение по названию),
# уже существующие не трогает. Править текст удобнее потом в админке.
#
# definition — простой текст; ссылки можно писать как [текст](/адрес/).
# Порядок не важен: на сайте термины сортируются по алфавиту.

intro: >-
  Словарь основных понятий космоэнергетики, световых частот и энергетических практик,
  которыми пользуются в направлении «Сфера сознания» центра «Путь Здоровья». Термины расположены по алфавиту,
  воспользуйтесь поиском или буквами алфавита. Описания отражают взгляды духовной
  традиции и не являются медицинскими сведениями.

terms:
  # --- Космоэнергетика ---
  - term: Космоэнергетика
    definition: >-
      Духовная практика работы с энергоинформационными космическими полями (каналами).
      Направлена на гармонизацию души, тела и сознания человека, очищение и защиту.
      Подробнее — в разделе [Космоэнергетика](/kosmoenergy/).

  - term: Космоэнергет
    definition: >-
      Человек, получивший посвящение в каналы космоэнергетики и использующий их
      для работы с собой и с другими людьми.

  - term: ЭКП (энергоинформационные космические поля)
    definition: >-
      Потоки энергии и информации, которые, согласно космоэнергетике, посылает
      людям Высший разум. Космоэнергеты называют их каналами.

  - term: Канал
    definition: >-
      В космоэнергетике — определённое энергоинформационное поле со своими свойствами
      и назначением (очищение, защита, гармонизация, поддержка). Каналы различаются
      по частоте и силе; известно более двухсот каналов.

  - term: Открытие канала
    definition: >-
      Подключение к каналу, в который получено посвящение, для работы
      на себя, другого человека, помещение или ситуацию.

  - term: Посвящение
    definition: >-
      Передача учителем ученику способности работать с каналом или энергией.
      Посвящение — не разовое событие, а начало процесса расширения сознания
      и ответственный шаг на духовном пути.

  - term: Блок каналов
    definition: >-
      Группа каналов, объединённых общим происхождением и уровнем. Посвящение
      проходят последовательно — от блока к блоку.

  - term: Буддийский блок
    definition: >-
      Первый, базовый блок каналов космоэнергетики. С него начинается обучение:
      каналы для очищения, гармонизации и общей поддержки.

  - term: Магический блок
    definition: >-
      Второй блок каналов космоэнергетики: более мощные каналы для очищения,
      защиты и работы с негативными воздействиями.

  - term: Блок Магистров
    definition: >-
      Магистерский блок каналов космоэнергетики — каналы высокого уровня
      для опытных космоэнергетов.

  - term: ХУТТА
    definition: >-
      Блок каналов космоэнергетики, в который проходят посвящение после
      основных блоков.

  - term: Сакральная Космология
    definition: >-
      Система каналов третьего уровня. По описанию традиции, это каналы
      из созвездия Стрельца — центра Галактики.

  - term: Каналы Майя (Космическая Теургия «Майя»)
    definition: >-
      Система из 75 каналов четвёртого уровня, связанная с наследием индейцев майя.
      Включает универсальные, чистящие, гармонизирующие, социальные, информационные
      и защитный каналы. Подробнее — на странице [Каналы Майя](/kanaly-maya/).

  - term: Высший разум
    definition: >-
      Объединённый разум высших космических цивилизаций, источник энергий
      космоэнергетики. В традиции его энергия понимается как Божественная,
      работающая на создание гармонии.

  - term: Абсолют
    definition: >-
      Первоисточник всего сущего. В практике центра человека учат брать энергию
      напрямую из Абсолюта, а не за счёт других людей.

  # --- Световые частоты ---
  - term: Световые частоты
    definition: >-
      Высоковибрационные Божественные энергии, в которые проходят посвящение.
      Работа с ними — это сонастройка и резонанс с энергиями высших сил.
      Подробнее — в разделе [Световые частоты](/svet_freq/).

  - term: Матрица
    definition: >-
      Группа световых частот, объединённых общим источником и назначением:
      например, Матрица Творца, Матрица Света, Матрица Господа, Матрица Феникса.

  - term: Блок энергий 95 Архангелов
    definition: >-
      Набор из 95 энергий Архангелов, в который проходят посвящение в разделе
      световых частот. Подробнее — на странице [Блок энергий 95 Архангелов](/arhangel95/).

  # --- Энергетическое строение человека ---
  - term: Аура
    definition: >-
      Энергетическое поле вокруг тела человека. Считается внешним проявлением
      тонких тел и отражает общее энергетическое и эмоциональное состояние.

  - term: Биополе
    definition: >-
      Энергетическое поле человека; то же, что [полевая оболочка](/materials/obolochka/).

  - term: Полевая оболочка
    definition: >-
      Внешняя граница энергетического поля человека. В гармоничном состоянии
      она симметрична относительно тела. Подробнее — на странице
      [Смещение полевой оболочки](/materials/obolochka/).

  - term: Смещение полевой оболочки
    definition: >-
      Сдвиг поля вперёд, назад, влево, вправо или его сжатие. По наблюдениям практиков,
      связано с постоянным внутренним напряжением: осуждением, обидой, страхом, гордыней.
      Все виды смещений — в [шпаргалке «Поля»](/materials/obolochka/#toc).

  - term: Вмятина (пробой) в биополе
    definition: >-
      Локальная деформация полевой оболочки, через которую, по описанию практиков,
      человек теряет энергию. Часто связана с сильными переживаниями.
      Подробнее — [Вмятины в биополе](/materials/obolochka/#sme_vmyatina).

  - term: Тонкие тела
    definition: >-
      Невидимые энергетические оболочки человека, окружающие физическое тело:
      эфирное, астральное (эмоциональное), ментальное и более высокие.

  - term: Ментальное тело
    definition: >-
      Тонкое тело, связанное с мыслями, убеждениями и стереотипами человека.

  - term: Астральное тело
    definition: >-
      Тонкое тело, связанное с эмоциями и желаниями человека.

  - term: Чакры
    definition: >-
      Энергетические центры человека, расположенные вдоль позвоночника.
      Основных чакр семь: муладхара, свадхистана, манипура, анахата,
      вишудха, аджна и сахасрара.

  - term: Муладхара
    definition: >-
      Первая, корневая чакра в основании позвоночника. Связана с жизненной силой,
      устойчивостью и чувством безопасности.

  - term: Свадхистана
    definition: >-
      Вторая чакра, ниже пупка. Связана с эмоциями, творчеством и сексуальной энергией.

  - term: Манипура
    definition: >-
      Третья чакра, в области солнечного сплетения. Связана с волей, самооценкой
      и отношениями власти.

  - term: Анахата
    definition: >-
      Четвёртая, сердечная чакра в центре груди. Связана с любовью, принятием
      и милосердием.

  - term: Вишудха
    definition: >-
      Пятая, горловая чакра. Связана с самовыражением, общением и умением
      высказать то, что на душе.

  - term: Аджна
    definition: >-
      Шестая чакра, между бровями («третий глаз»). Связана с интуицией
      и ясностью восприятия.

  - term: Сахасрара
    definition: >-
      Седьмая чакра, на макушке. Связана с духовностью и связью с Высшим.

  - term: Меридианы
    definition: >-
      Энергетические каналы в теле человека, по которым, согласно восточным
      представлениям, движется жизненная энергия.

  # --- Принципы и работа с энергией ---
  - term: Гармоничный энергообмен
    definition: >-
      Закон равновесия между тем, что человек отдаёт и получает. Нарушение
      энергообмена, по представлениям традиции, ведёт к дисгармонии в жизни.

  - term: Единство мысли, слова и действия
    definition: >-
      Одна из форм закона гармоничного энергообмена: мысль, сказанное и сделанное
      должны совпадать. Подробнее — в статье [Слово и дело](/materials/blogs/slovo_delo/).

  - term: Милосердие
    definition: >-
      Помощь другому без того, чтобы забирать на себя его страдания. В отличие
      от сострадания («со-страдания»), не создаёт энергетического пробоя
      в области сердца.

  - term: Энергетическая чистка
    definition: >-
      Очищение ауры, чакр, тонких тел или помещения от негативной энергии
      с помощью каналов или световых частот.

  - term: Энергетическая защита
    definition: >-
      Работа с каналами, которая помогает человеку сохранять собственную энергию
      и не поддаваться негативным воздействиям извне.

  - term: Негативная привязка
    definition: >-
      Энергетическая связь с человеком, ситуацией или событием, которая отнимает силы
      и мешает двигаться дальше. Снимается энергетической чисткой.

  - term: Родовая карма
    definition: >-
      Негативные программы, которые, по представлениям традиции, передаются
      по материнской или отцовской линии рода.

  - term: Геопатогенная зона
    definition: >-
      Участок местности или помещения с неблагоприятным, по мнению практиков,
      энергетическим фоном.

  # --- Кинезиология и биорезонанс ---
  - term: Кинезиология
    definition: >-
      Метод, основанный на мышечном тестировании: по реакции мышц специалист оценивает
      состояние организма и ищет причины дисбаланса. Подробнее — в разделе
      [Кинезиология](/kineziolog/).

  - term: Мануально-мышечное тестирование (ММТ)
    definition: >-
      Основной инструмент кинезиологии: специалист слегка надавливает на мышцу
      и оценивает, насколько она сильна или слаба в ответ на разные воздействия.

  - term: Биорезонанс
    definition: >-
      Метод, основанный на представлении, что органы и системы организма имеют
      собственные частоты колебаний. Биорезонансное тестирование оценивает
      энергетическое состояние организма. Подробнее — в разделе [Биорезонанс](/biorezonans/).
